# Canonical Phase 3 appliance: QEMU virt / Cortex-A7, hard-float, Buildroot 2026.05.2.
# Every symbol below was verified to exist in the real 2026.05.2 source tree;
# see fixtures/buildroot-symbols.json for file/line provenance.

# --- Architecture -----------------------------------------------------------
BR2_arm=y
BR2_cortex_a7=y
BR2_ARM_EABI=y

# --- Toolchain --------------------------------------------------------------
BR2_TOOLCHAIN_BUILDROOT_GLIBC=y

# --- System -----------------------------------------------------------------
BR2_TARGET_GENERIC_HOSTNAME="embed-appliance"
BR2_TARGET_GENERIC_GETTY_PORT="ttyAMA0"

# --- Userspace --------------------------------------------------------------
BR2_PACKAGE_BUSYBOX=y
BR2_PACKAGE_APPLIANCE_DIAG=y

# --- Kernel -----------------------------------------------------------------
BR2_LINUX_KERNEL=y
BR2_LINUX_KERNEL_CUSTOM_VERSION=y
BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="6.18.50"
BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage"

# --- Filesystem images ------------------------------------------------------
BR2_TARGET_ROOTFS_EXT2=y
BR2_TARGET_ROOTFS_EXT2_4=y
BR2_TARGET_ROOTFS_CPIO=y
BR2_TARGET_ROOTFS_CPIO_GZIP=y

# --- Root filesystem customization -----------------------------------------
BR2_ROOTFS_OVERLAY="$(BR2_EXTERNAL_QEMU_VIRT_A7_PATH)/board/qemu-virt-a7/rootfs-overlay"
